spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/messenger}
    username: ${DB_USER:messenger}
    password: ${DB_PASSWORD:messenger_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
