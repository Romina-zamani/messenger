services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger_dev
    ports:
      - "5433:5432"
    volumes:
      - messenger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  messenger-data:
